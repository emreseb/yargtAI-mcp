[project]
name = "ictihat-mcp"
version = "0.1.0"
description = "Türk hukuku içtihat/mevzuat için semantik arama MCP sunucusu (RAG; thin-slice)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "lancedb>=0.13.0",
    "pyarrow>=16.0.0",
    # Gömme için fastembd: ONNX Runtime tabanlı, torch/CUDA GEREKTİRMEZ.
    # (sentence-transformers torch'u ve GB'larca NVIDIA paketini çekiyordu.)
    "fastembed>=0.4.0",
    # Dilekçe .docx (Word) üretimi için.
    "python-docx>=1.1.0",
]

[project.scripts]
# stdio MCP sunucusu (yapay zekâ istemcisinin bağlandığı taraf)
ictihat-mcp = "ictihat_mcp.server:main"
# İçtihat/özelge indeksini GİB + Yargıtay'dan kuran çevrimdışı araç
ictihat-index = "ictihat_mcp.ingest.build_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ictihat_mcp"]
